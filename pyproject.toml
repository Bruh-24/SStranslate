[project]
name = "docker_translation"
version = "0.1.0"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "numba>=0.68.1",
    "sentencepiece>=0.2.3",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
